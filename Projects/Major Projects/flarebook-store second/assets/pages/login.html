<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FlareBook Store</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="square-logo-placeholder">
                <img src="../images/logo/square_logo.png" alt="FlareBook Logo" class="loading-logo">
                <div class="flare-animation"></div>
                <div class="flare-animation delay-1"></div>
                <div class="flare-animation delay-2"></div>
            </div>
            <br>
            <p class="loading-text">Loading Login...</p>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="main-content hidden">
        <div class="auth-container">
            <div class="auth-header">
                <h1 class="auth-title">Welcome to FlareBook Store</h1>
                <p class="auth-subtitle">Sign in or create an account</p>
            </div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Login</button>
                <button class="auth-tab" onclick="switchTab('register')">Register</button>
            </div>
            
            <!-- LOGIN FORM -->
            <div id="login-content" class="auth-content active">
                <form class="auth-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" placeholder="you@example.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" placeholder="Enter password" required>
                    </div>
                    
                    <div class="captcha-container">
                        <div class="captcha-question" id="captchaQuestion"></div>
                        <div class="captcha-options" id="captchaOptions"></div>
                    </div>
                    
                    <button type="submit" class="submit-btn">Login</button>
                    
                    <div class="form-divider">
                        <span>Or continue with</span>
                    </div>
                    
                    <div class="social-login">
                        <button type="button" class="social-btn google">
                            <i class="fab fa-google"></i> Google
                        </button>
                        <button type="button" class="social-btn microsoft">
                            <i class="fab fa-microsoft"></i> Microsoft
                        </button>
                    </div>
                    
                    <div class="form-footer">
                        Don't have an account? 
                        <button type="button" class="toggle-auth" onclick="switchTab('register')">Register here</button>
                    </div>
                </form>
            </div>
            
            <!-- REGISTER FORM -->
            <div id="register-content" class="auth-content">
                <form class="auth-form" onsubmit="handleRegister(event)">
                    <div class="reg-type-tabs">
                        <button type="button" class="reg-type-tab active" onclick="switchRegType('personal', this)">Personal</button>
                        <button type="button" class="reg-type-tab" onclick="switchRegType('business', this)">Business</button>
                    </div>

                    <!-- Personal Registration -->
                    <div id="personal-form">
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-input" placeholder="Your Name" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <div class="verification-container">
                                <input type="email" class="form-input verification-input" placeholder="you@example.com" required>
                                <button type="button" class="verify-btn" onclick="verifyEmail(this)">Verify</button>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-input" placeholder="Create password" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-input" placeholder="Re-enter password" required>
                            </div>
                        </div>
                        
                        <div class="social-login">
                            <button type="button" class="social-btn google">
                                <i class="fab fa-google"></i> Google
                            </button>
                            <button type="button" class="social-btn microsoft">
                                <i class="fab fa-microsoft"></i> Microsoft
                            </button>
                        </div>
                        
                        <button type="submit" class="submit-btn">Create Personal Account</button>
                    </div>
                    
                    <!-- Business Registration - 2 Steps -->
                    <div id="business-form" style="display: none;">
                        <!-- Step 1 -->
                        <div id="business-step-1" class="registration-step active">
                            <h3 style="margin-bottom: 25px; color: var(--flare-secondary);">Step 1: Personal Information</h3>
                            
                            <div class="form-group">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-input" placeholder="Your Name" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Email</label>
                                <div class="verification-container">
                                    <input type="email" class="form-input verification-input" placeholder="you@company.com" required>
                                    <button type="button" class="verify-btn" onclick="verifyEmail(this)">Verify</button>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Phone Number</label>
                                <div class="verification-container">
                                    <input type="tel" class="form-input verification-input" placeholder="9876543210" required>
                                    <button type="button" class="verify-btn" onclick="verifyPhone(this)">Verify</button>
                                </div>
                            </div>
                            
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-input" placeholder="Create password" required>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">Confirm Password</label>
                                    <input type="password" class="form-input" placeholder="Confirm password" required>
                                </div>
                            </div>
                            
                            <div class="form-navigation">
                                <div></div>
                                <button type="button" class="nav-btn next" onclick="nextBusinessStep()">Next Step</button>
                            </div>
                        </div>
                        
                        <!-- Step 2 -->
                        <div id="business-step-2" class="registration-step">
                            <h3 style="margin-bottom: 25px; color: var(--flare-secondary);">Step 2: Business Information</h3>
                            
                            <div class="form-group">
                                <label class="form-label">Business Name</label>
                                <input type="text" class="form-input" placeholder="Your Business Name" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Do you have GSTIN Number?</label>
                                <div style="display: flex; gap: 20px; margin-top: 10px;">
                                    <label style="display: flex; align-items: center; gap: 8px;">
                                        <input type="radio" name="has-gstin" value="yes" onchange="toggleGstinField(true)"> Yes
                                    </label>
                                    <label style="display: flex; align-items: center; gap: 8px;">
                                        <input type="radio" name="has-gstin" value="no" checked onchange="toggleGstinField(false)"> No
                                    </label>
                                </div>
                            </div>
                            
                            <div class="form-group" id="gstin-field" style="display: none;">
                                <label class="form-label">GSTIN Number</label>
                                <input type="text" class="form-input" placeholder="22AAAAA0000A1Z5">
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Personal Designation</label>
                                <input type="text" class="form-input" placeholder="e.g., Owner, Manager, CEO" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">PAN Number</label>
                                <input type="text" class="form-input" placeholder="ABCDE1234F" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Business Address</label>
                                <textarea class="form-input" rows="3" placeholder="Complete business address" required></textarea>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">PIN Code</label>
                                <input type="text" class="form-input" placeholder="110001" required>
                            </div>
                            
                            <div class="form-navigation">
                                <button type="button" class="nav-btn" onclick="prevBusinessStep()">Previous</button>
                                <button type="button" class="nav-btn next" onclick="completeBusinessRegistration()">Create Business Account</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-footer">
                        Already have an account? 
                        <button type="button" class="toggle-auth" onclick="switchTab('login')">Login here</button>
                    </div>
                </form>
            </div>
            
            <div style="text-align: center; margin-top: 30px;">
                <a href="../../index.html" style="color: var(--flare-primary); text-decoration: none;">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <script>
        

        // Hide loading screen
        setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('main-content').classList.remove('hidden');
        }, 1500);
        
        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-content').forEach(c => c.classList.remove('active'));
    
            document.querySelector(`.auth-tab:nth-child(${tab === 'login' ? '1' : '2'})`).classList.add('active');
            document.getElementById(tab + '-content').classList.add('active');
    
            // Generate new captcha when switching to login tab
            if (tab === 'login') {
                generateCaptcha();
            }
        }
        
        // Registration type switching
        function switchRegType(type, clickedButton) {   
            // Remove active class from ALL tabs
            document.querySelectorAll('.reg-type-tab').forEach(b => b.classList.remove('active'));
    
            // Add active class to clicked tab
            clickedButton.classList.add('active');
    
            document.getElementById('personal-form').style.display = type === 'personal' ? 'block' : 'none';
            document.getElementById('business-form').style.display = type === 'business' ? 'block' : 'none';
    
            // Reset business form to step 1 when switching
            if (type === 'business') {
                document.getElementById('business-step-1').classList.add('active');
                document.getElementById('business-step-2').classList.remove('active');
                toggleGstinField(false);
                document.querySelector('input[name="has-gstin"][value="no"]').checked = true;
            }
        }
        
        // Business form steps
        function nextBusinessStep() {
            // Check if email is verified
            const emailVerifyBtn = document.querySelector('#business-step-1 .verify-btn');
            const phoneVerifyBtn = document.querySelectorAll('#business-step-1 .verify-btn')[1];
    
            if (!emailVerifyBtn || emailVerifyBtn.textContent !== '✓ Verified') {
                alert('Please verify your email before proceeding to Step 2');
                document.querySelector('#business-step-1 input[placeholder="you@company.com"]').focus();
                return;
            }
    
            if (!phoneVerifyBtn || phoneVerifyBtn.textContent !== '✓ Verified') {
                alert('Please verify your phone number before proceeding to Step 2');
                document.querySelector('#business-step-1 input[placeholder="+91 9876543210"]').focus();
                return;
            }
    
            // Validate step 1 fields
            const inputs = document.querySelectorAll('#business-step-1 .form-input');
            let isValid = true;
            let errorMessage = '';
    
            inputs.forEach(input => {
                if (!input.value.trim()) {
                    isValid = false;
                    errorMessage = 'Please fill all fields in Step 1';
                }
                
                if (input.type === 'email' && !input.value.includes('@')) {
                    isValid = false;
                    errorMessage = 'Please enter a valid email address';
                }
                
                if (input.type === 'password' && input.value.length < 8) {
                    isValid = false;
                    errorMessage = 'Password must be at least 8 characters';
                }
            });
            
            // Check password match
            const password = inputs[3]?.value;
            const confirmPassword = inputs[4]?.value;
            if (password !== confirmPassword) {
                isValid = false;
                errorMessage = 'Passwords do not match';
            }
            
            if (isValid) {
                document.getElementById('business-step-1').classList.remove('active');
                document.getElementById('business-step-2').classList.add('active');
            } else {
                alert(errorMessage);
            }
        }
        
        function prevBusinessStep() {
            document.getElementById('business-step-2').classList.remove('active');
            document.getElementById('business-step-1').classList.add('active');
        }
        
        // GSTIN field toggle
        function toggleGstinField(show) {
            const gstinField = document.getElementById('gstin-field');
            if (show) {
                gstinField.style.display = 'block';
            } else {
                gstinField.style.display = 'none';
            }
        }
        
        // Verification buttons
        function verifyEmail(button) {
            const input = button.previousElementSibling;
    
            if (!input.value.trim()) {
                alert('Please enter an email address first');
                input.focus();
                return;
            }
    
            if (!input.value.includes('@')) {
                alert('Please enter a valid email address');
                input.focus();
                return;
            }
    
            const originalText = button.textContent;
            button.disabled = true;
            button.textContent = 'Sending...';
    
            setTimeout(() => {
                button.textContent = '✓ Verified';
                button.style.background = 'var(--flare-secondary)';
                button.style.color = 'white';
            }, 2000);
        }

        function verifyPhone(button) {
            const input = button.previousElementSibling;
    
            if (!input.value.trim()) {
                alert('Please enter a phone number first');
                input.focus();
                return;
            }
    
            // Simple phone validation (at least 10 digits)
            const digits = input.value.replace(/\D/g, '');
            if (digits.length < 10) {
                alert('Please enter a valid phone number (at least 10 digits)');
                input.focus();
                return;
            }
    
            const originalText = button.textContent;
            button.disabled = true;
            button.textContent = 'Sending...';
    
            setTimeout(() => {
                button.textContent = '✓ Verified';
                button.style.background = 'var(--flare-secondary)';
                button.style.color = 'white';
            }, 2000);
        }
        
        // Form submissions
        function handleLogin(e) {
            e.preventDefault();
    
            // Get selected captcha option
            const selectedCaptcha = document.querySelector('.captcha-option.selected');
    
            // Check if captcha is selected and correct (Piano is correct answer)
            if (!selectedCaptcha) {
                alert('Please select an answer to the captcha question');
                return;
            }
    
            if (!currentCaptcha || selectedCaptcha.textContent !== currentCaptcha.correctAnswer) {
                alert('Incorrect captcha answer. Please try again.');
                generateCaptcha(); // Generate new captcha on wrong answer
                return;
            }
    
            // Get login credentials
            const email = document.querySelector('#login-content input[type="email"]').value;
            const password = document.querySelector('#login-content input[type="password"]').value;
            
            // Basic validation
            if (!email || !password) {
                alert('Please enter both email and password');
                return;
            }
            
            if (!email.includes('@')) {
                alert('Please enter a valid email address');
                return;
            }
            
            // Check against stored users
            const users = JSON.parse(localStorage.getItem('flarebook_users')) || [];
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                // Save current user
                localStorage.setItem('flarebook_current_user', JSON.stringify(user));
                
                // Check if business account is pending verification
                if (user.type === 'business' && user.status === 'pending_verification') {
                    alert(`✅ LOGIN SUCCESSFUL!\n\nWelcome back, ${user.name}!\n\n📋 Account Status: BUSINESS ACCOUNT (Pending Verification)\n⏰ Verification usually takes 2-3 working days\n📚 You can browse and purchase books\n💼 Business features will unlock after verification`);
                } else {
                    alert(`✅ LOGIN SUCCESSFUL!\n\nWelcome back, ${user.name}!`);
                }
                
                // Redirect to home page
                window.location.href = '../../index.html';
            } else {
                alert('Invalid email or password. Please try again.');
            }
        }
        
        function handleRegister(e) {
            e.preventDefault();
            const isBusiness = document.getElementById('business-form').style.display !== 'none';
            
            if (isBusiness) {
                const isStep2 = document.getElementById('business-step-2').classList.contains('active');
                if (!isStep2) {
                    alert('Please complete all steps');
                    return;
                }
            }
            
            alert('Registration successful!');
            switchTab('login');
        }
        
        function completeBusinessRegistration() {
            // Collect all business data
            const step1Inputs = document.querySelectorAll('#business-step-1 .form-input');
            const step2Inputs = document.querySelectorAll('#business-step-2 .form-input');
    
            let isValid = true;
    
            // Validate all required fields
            step1Inputs.forEach(input => {
                if (!input.value.trim() && input.hasAttribute('required')) {
                    isValid = false;
                }
            });
    
            step2Inputs.forEach(input => {
                if (!input.value.trim() && input.hasAttribute('required')) {
                    isValid = false;
                }
            });
    
            if (!isValid) {
                alert('Please fill all required fields marked with *');
                return;
            }
    
            // Collect data
            const businessData = {
                // Personal Info
                fullName: step1Inputs[0]?.value,
                email: step1Inputs[1]?.value,
                phone: step1Inputs[2]?.value,
                password: step1Inputs[3]?.value,
                
                // Business Info
                companyName: step2Inputs[0]?.value,
                hasGstin: document.querySelector('input[name="has-gstin"]:checked')?.value,
                gstinNumber: document.getElementById('gstin-field')?.querySelector('.form-input')?.value || 'Not provided',
                designation: step2Inputs[2]?.value,
                panNumber: step2Inputs[3]?.value,
                address: step2Inputs[4]?.value,
                pincode: step2Inputs[5]?.value,
                
                // Metadata
                registrationDate: new Date().toLocaleDateString(),
                status: 'pending_verification',
                accountType: 'business'
            };
            
            // Save to localStorage
            const businessAccounts = JSON.parse(localStorage.getItem('flarebook_business_accounts')) || [];
            businessAccounts.push(businessData);
            localStorage.setItem('flarebook_business_accounts', JSON.stringify(businessAccounts));
            
            // Also save as regular user (for login purposes)
            const users = JSON.parse(localStorage.getItem('flarebook_users')) || [];
            users.push({
                id: Date.now(),
                name: businessData.fullName,
                email: businessData.email,
                password: businessData.password, // In real app, hash this!
                type: 'business',
                status: 'pending_verification',
                createdAt: new Date().toISOString()
            });
            localStorage.setItem('flarebook_users', JSON.stringify(users));
            
            // Show success message with instructions
            alert(`🎉 BUSINESS ACCOUNT REGISTERED SUCCESSFULLY!\n\n✅ Your account has been created: ${businessData.email}\n✅ Company: ${businessData.companyName}\n\n📋 IMPORTANT NEXT STEPS:\n────────────────────\n1. You can LOGIN and use the site immediately\n2. Your business documents are UNDER REVIEW\n3. Business features will be activated after verification\n4. Verification usually takes 2-3 working days\n\n📞 Our team will contact you at: ${businessData.phone}\n📧 Verification updates sent to: ${businessData.email}\n\n💼 You can browse and purchase books while waiting for verification!`);
            
            // Switch back to login tab
            switchTab('login');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Make sure only personal form is shown initially
            document.getElementById('personal-form').style.display = 'block';
            document.getElementById('business-form').style.display = 'none';
    
            // Generate random captcha
            generateCaptcha();
        });

        const captchaQuestions = [
            {
                question: "What has keys but can't open locks?",
                options: ["Piano", "Door", "Keyboard", "Treasure"],
                correctAnswer: "Piano"
            },
            {
                question: "Which of these is NOT a book?",
                options: ["Harry Potter", "To Kill a Mockingbird", "Avocado Toast", "1984"],
                correctAnswer: "Avocado Toast"
            },
            {
                question: "Complete: 'The ___ in the Hat'",
                options: ["Dog", "Cat", "Fish", "Bird"],
                correctAnswer: "Cat"
            },
            {
                question: "What do you use to read an ebook?",
                options: ["Microwave", "Device/Reader", "Refrigerator", "Toaster"],
                correctAnswer: "Device/Reader"
            },
            {
                question: "Which animal is known as the 'ship of the desert'?",
                options: ["Camel", "Horse", "Elephant", "Kangaroo"],
                correctAnswer: "Camel"
            }
        ];

        let currentCaptcha = null;

        // Generate random captcha
        function generateCaptcha() {
            // Pick random question
            const randomIndex = Math.floor(Math.random() * captchaQuestions.length);
            currentCaptcha = captchaQuestions[randomIndex];
            
            // Display question
            document.getElementById('captchaQuestion').textContent = currentCaptcha.question;
            
            // Display options
            const optionsContainer = document.getElementById('captchaOptions');
            optionsContainer.innerHTML = '';
            
            // Shuffle options
            const shuffledOptions = [...currentCaptcha.options].sort(() => Math.random() - 0.5);
            
            shuffledOptions.forEach(option => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'captcha-option';
                button.textContent = option;
                button.onclick = function() { selectCaptcha(this); };
                optionsContainer.appendChild(button);
            });
        }
        
        // Select captcha answer
        function selectCaptcha(clickedButton) {
            // Remove selected class from all captcha options
            const allOptions = document.querySelectorAll('.captcha-option');
            allOptions.forEach(option => option.classList.remove('selected'));
            
            // Add selected class to clicked button
            clickedButton.classList.add('selected');
        }

        function setupCaptchaSelection() {
            const captchaOptions = document.querySelectorAll('.captcha-option');
    
            captchaOptions.forEach(option => {
                // Remove existing click listeners
                option.replaceWith(option.cloneNode(true));
            });
    
            // Re-select after cloning
            const newCaptchaOptions = document.querySelectorAll('.captcha-option');
    
            newCaptchaOptions.forEach(option => {
                option.addEventListener('click', function() {
                    // Remove selected class from all options
                    newCaptchaOptions.forEach(opt => opt.classList.remove('selected'));
                    // Add selected class to clicked option
                    this.classList.add('selected');
                });
            });
        }
    </script>
</body>
</html>
