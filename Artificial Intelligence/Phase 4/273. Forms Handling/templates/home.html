<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Form Example</title>

</head>

<body>

    <h1>
        Student Form
    </h1>

    <form
        action="/submit"
        method="POST"
    >

        <label>
            Name
        </label>

        <br>

        <input
            type="text"
            name="name"
            required
        >

        <br><br>

        <label>
            Age
        </label>

        <br>

        <input
            type="number"
            name="age"
            required
        >

        <br><br>

        <button type="submit">
            Submit
        </button>

    </form>

</body>

</html>
