<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlareBook Store - Ignite Your Mind</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="logo-container">
                <div class="square-logo-placeholder">
                    <div class="flare-animation"></div>
                    <div class="flare-animation delay-1"></div>
                    <div class="flare-animation delay-2"></div>
                </div>
            </div>
            <p class="loading-text">Igniting Your Reading Journey...</p>
        </div>
    </div>

    <!-- Main Content (hidden until loaded) -->
    <div id="main-content" class="main-content hidden">
        <!-- Navigation will be added later -->
        <div class="container">
            <div id="page-content">
                <!-- Content will be dynamically loaded here -->
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
