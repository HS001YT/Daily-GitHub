<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Spam Detector
</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>

</head>

<body>

<h1>
Spam Message Detector
</h1>

<form
    action="/predict"
    method="POST"
>

<textarea
    name="message"
    rows="8"
    cols="60"
    placeholder="Enter message here..."
    required
></textarea>

<br><br>

<button type="submit">
Check Message
</button>

</form>

</body>

</html>
