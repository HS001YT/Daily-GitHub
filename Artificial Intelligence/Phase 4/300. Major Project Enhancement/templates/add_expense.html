{% extends "base.html" %}

{% block content %}

<h1>
    Add Expense
</h1>

{% if error %}

<div class="error">

    {{ error }}

</div>

{% endif %}

<form method="POST">

    <label>
        Expense Title
    </label>

    <input
        type="text"
        name="description"
        required
    >

    <label>
        Amount
    </label>

    <input
        type="number"
        step="0.01"
        name="amount"
        required
    >

    <button type="submit">
        Save Expense
    </button>

</form>

{% endblock %}
