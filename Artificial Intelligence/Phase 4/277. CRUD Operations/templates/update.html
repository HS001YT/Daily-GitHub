<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>
</head>

<body>

    <h1>Update Student</h1>

    <form
        action="/update/{{ student[0] }}"
        method="POST">

        <input
            type="text"
            name="name"
            value="{{ student[1] }}"
            required>

        <br><br>

        <input
            type="number"
            name="age"
            value="{{ student[2] }}"
            required>

        <br><br>

        <button type="submit">
            Update
        </button>

    </form>

</body>

</html>
