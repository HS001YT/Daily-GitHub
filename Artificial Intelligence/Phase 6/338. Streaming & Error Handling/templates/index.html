<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>AI Chatbot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="app">

        <header>
            <div>
                <h1>AI Chatbot</h1>
                <p>Streaming AI responses with conversation memory</p>
            </div>

            <button
                id="clearButton"
                class="clear-button"
            >
                Clear Chat
            </button>
        </header>


        <main
            id="chatContainer"
            class="chat-container"
        >

            <div class="welcome-message">
                <h2>Hello!</h2>
                <p>
                    Ask me anything. My response will appear
                    as it is generated.
                </p>
            </div>

        </main>


        <form
            id="chatForm"
            class="chat-form"
        >

            <textarea
                id="messageInput"
                placeholder="Type your message..."
                rows="1"
                required
            ></textarea>

            <button
                id="sendButton"
                type="submit"
            >
                Send
            </button>

        </form>


        <div
            id="status"
            class="status"
        ></div>

    </div>


    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>
</html>
