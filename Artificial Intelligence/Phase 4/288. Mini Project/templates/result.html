<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Health Analysis Result
</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>

</head>

<body>

{% if error %}

    <h1>
        Error
    </h1>

    <h2>
        {{ message }}
    </h2>

{% else %}

    <h1>
        Analysis Result
    </h1>

    <h2>
        Risk Level:
        {{ risk_level }}
    </h2>

    <h3>
        Risk Score:
        {{ risk_score }}
        / 3
    </h3>

    <p>
        {{ recommendation }}
    </p>

{% endif %}

<br>

<a href="/">
    Analyze Again
</a>

</body>

</html>
