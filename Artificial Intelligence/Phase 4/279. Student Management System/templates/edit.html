<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Student</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <h1>
        Edit Student
    </h1>

    <form
        action="/update/{{ student[0] }}"
        method="POST"
    >

        <input
            type="text"
            name="name"
            value="{{ student[1] }}"
            required
        >

        <br><br>

        <input
            type="number"
            name="age"
            value="{{ student[2] }}"
            required
        >

        <br><br>

        <input
            type="text"
            name="course"
            value="{{ student[3] }}"
            required
        >

        <br><br>

        <button type="submit">
            Update Student
        </button>

    </form>

    <br>

    <a href="/students">
        Back
    </a>

</body>

</html>
