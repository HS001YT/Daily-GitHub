<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Students</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <h1>
        Student Records
    </h1>

    <table>

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Age</th>

            <th>Course</th>

            <th>Actions</th>

        </tr>

        {% for student in students %}

        <tr>

            <td>{{ student[0] }}</td>

            <td>{{ student[1] }}</td>

            <td>{{ student[2] }}</td>

            <td>{{ student[3] }}</td>

            <td>

                <a href="/edit/{{ student[0] }}">
                    Edit
                </a>

                |

                <a href="/delete/{{ student[0] }}">
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/">
        Add New Student
    </a>

</body>

</html>
