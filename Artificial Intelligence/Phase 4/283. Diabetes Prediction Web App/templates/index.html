<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Diabetes Predictor</title>
</head>
<body>

<h1>Diabetes Prediction System</h1>

<form action="/predict" method="POST">

    <input type="number" name="pregnancies" placeholder="Pregnancies" required><br><br>

    <input type="number" name="glucose" placeholder="Glucose" required><br><br>

    <input type="number" name="blood_pressure" placeholder="Blood Pressure" required><br><br>

    <input type="number" name="skin_thickness" placeholder="Skin Thickness" required><br><br>

    <input type="number" name="insulin" placeholder="Insulin" required><br><br>

    <input type="number" step="any" name="bmi" placeholder="BMI" required><br><br>

    <input type="number" step="any" name="pedigree" placeholder="Pedigree Function" required><br><br>

    <input type="number" name="age" placeholder="Age" required><br><br>

    <button type="submit">
        Predict
    </button>

</form>

</body>
</html>
