<!-- Full Header (Both Top and Bottom) -->
<header class="main-header">
    <!-- Top Row -->
    <div class="header-top" id="headerTop">
        <div class="header-section">
            <!-- Left: Logo -->
            <div class="header-logo">
                <img src="../images/logo/rectangle_logo.png" alt="FlareBook Store" class="header-logo-img">
            </div>
            
            <!-- Center: Navigation -->
            <nav class="header-nav">
    <a href="#" class="nav-link" data-page="home">Home</a>
    <a href="#" class="nav-link" data-page="category">Category</a>
    <a href="../pages/about.html" class="nav-link">About</a>
</nav>
            
            <!-- Right: Login Button -->
            <div class="header-actions">
                <button class="login-btn" id="headerLoginBtn">
                    <i class="fas fa-user"></i> Login
                </button>
            </div>
        </div>
    </div>
    
    <!-- Bottom Row -->
    <div class="header-bottom" id="headerBottom">
        <div class="header-section">
            <!-- Search Bar -->
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" id="searchInput" 
                           placeholder="Search books, authors, categories..."
                           autocomplete="off">
                    <button class="search-btn">Search</button>
                </div>
                <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
            </div>
            
            <!-- Right: Favorites & Cart -->
            <div class="header-icons">
                <a href="../../assets/pages/wishlist.html" class="icon-btn" id="favoritesBtn">
                    <i class="far fa-heart"></i>
                    <span class="icon-badge">0</span>
                </a>
                <a href="../../assets/pages/cart.html" class="icon-btn" id="cartBtn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="icon-badge">0</span>
                </a>
            </div>
        </div>
    </div>
</header>

<!-- Scroll to Top Button -->
<button class="scroll-to-top" id="scrollToTopBtn" aria-label="Scroll to top">
    <i class="fas fa-chevron-up"></i>
</button>
