<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
History
</title>

<link
rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}"
>

</head>

<body>

<h1>
Prediction History
</h1>

<table>

<tr>

<th>ID</th>

<th>User Text</th>

<th>Prediction</th>

</tr>

{% for row in records %}

<tr>

<td>{{ row[0] }}</td>

<td>{{ row[1] }}</td>

<td>{{ row[2] }}</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/">
Back
</a>

</body>

</html>
