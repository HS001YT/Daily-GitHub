<!-- Shared Header Component -->
<header class="main-header">
    <!-- Top Row -->
    <div class="header-top" id="headerTop">
        <div class="header-section">
            <!-- Left: Logo -->
            <div class="header-logo">
                <a href="index.html" class="logo-link">
                    <img src="assets/images/logo/rectangle_logo.png" alt="FlareBook Store" class="header-logo-img">
                </a>
            </div>
            
            <!-- Center: Navigation -->
            <nav class="header-nav">
                <a href="#" class="nav-link" data-page="home">Home</a>
                <a href="#" class="nav-link" data-page="category">Category</a>
                <a href="#" class="nav-link" data-page="about">About</a>
            </nav>
            
            <!-- Right: Login Button -->
            <div class="header-actions">
                <button class="login-btn" id="headerLoginBtn">
                    <i class="fas fa-user"></i> <span class="login-text">Login</span>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Bottom Row -->
    <div class="header-bottom" id="headerBottom">
        <div class="header-section">
            <!-- Search Bar with Typewriter Effect -->
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" id="searchInput" autocomplete="off">
            <!-- Typewriter placeholder will be added by JavaScript -->
                    <button class="search-btn">Search</button>
                </div>
                <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
            </div>
            
            <!-- Right: Favorites & Cart -->
            <div class="header-icons">
                <a href="assets/pages/wishlist.html" class="icon-btn" id="favoritesBtn">
                    <i class="far fa-heart"></i>
                    <span class="icon-badge">0</span>
                </a>
                <a href="assets/pages/cart.html" class="icon-btn" id="cartBtn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="icon-badge">0</span>
                </a>
            </div>
        </div>
    </div>
</header>
<button class="mobile-menu-toggle">
    <i class="fas fa-bars"></i>
</button>
