<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Input Validation Demo
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <h1>
        Health Input Validation
    </h1>

    <form
        action="/predict"
        method="POST"
    >

        <input
            type="number"
            name="age"
            placeholder="Age"
            min="1"
            max="120"
            required
        >

        <br><br>

        <input
            type="number"
            step="0.01"
            name="bmi"
            placeholder="BMI"
            required
        >

        <br><br>

        <input
            type="number"
            name="glucose"
            placeholder="Glucose"
            required
        >

        <br><br>

        <button type="submit">
            Submit
        </button>

    </form>

</body>

</html>
