<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Records</title>
</head>

<body>

    <h1>Student Records</h1>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>

        {% for row in records %}

        <tr>

            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>

            <td>

                <a href="/edit/{{ row[0] }}">
                    Edit
                </a>

                |

                <a href="/delete/{{ row[0] }}">
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/">
        Add Student
    </a>

</body>

</html>
