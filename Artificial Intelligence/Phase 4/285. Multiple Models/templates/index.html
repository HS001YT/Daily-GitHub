<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Multiple Model Prediction
</title>

</head>

<body>

<h1>
Heart Disease Prediction
</h1>

<form action="/predict" method="POST">

<select name="model">

<option>
Logistic Regression
</option>

<option>
Decision Tree
</option>

<option>
Random Forest
</option>

</select>

<br><br>

<input type="number" name="age" placeholder="Age" required><br><br>

<input type="number" name="sex" placeholder="Sex" required><br><br>

<input type="number" name="cp" placeholder="CP" required><br><br>

<input type="number" name="trestbps" placeholder="Trestbps" required><br><br>

<input type="number" name="chol" placeholder="Cholesterol" required><br><br>

<input type="number" name="fbs" placeholder="FBS" required><br><br>

<input type="number" name="restecg" placeholder="Rest ECG" required><br><br>

<input type="number" name="thalach" placeholder="Thalach" required><br><br>

<input type="number" name="exang" placeholder="Exang" required><br><br>

<input type="number" step="any" name="oldpeak" placeholder="Oldpeak" required><br><br>

<input type="number" name="slope" placeholder="Slope" required><br><br>

<input type="number" name="ca" placeholder="CA" required><br><br>

<input type="number" name="thal" placeholder="Thal" required><br><br>

<button type="submit">
Predict
</button>

</form>

</body>

</html>
