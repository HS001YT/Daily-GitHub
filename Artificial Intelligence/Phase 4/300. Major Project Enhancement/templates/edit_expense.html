{% extends "base.html" %}

{% block content %}

<h1>
    Edit Expense
</h1>

<form method="POST">

    <label>
        Expense Title
    </label>

    <input
        type="text"
        name="description"
        value="{{ expense[1] }}"
        required
    >

    <label>
        Amount
    </label>

    <input
        type="number"
        step="0.01"
        name="amount"
        value="{{ expense[2] }}"
        required
    >

    <button type="submit">
        Update Expense
    </button>

</form>

{% endblock %}
