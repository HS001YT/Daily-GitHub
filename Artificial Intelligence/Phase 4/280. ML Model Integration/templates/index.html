<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Iris Predictor
    </title>

</head>

<body>

    <h1>
        Iris Flower Predictor
    </h1>

    <form
        action="/predict"
        method="POST"
    >

        <input
            type="number"
            step="any"
            name="sepal_length"
            placeholder="Sepal Length"
            required
        >

        <br><br>

        <input
            type="number"
            step="any"
            name="sepal_width"
            placeholder="Sepal Width"
            required
        >

        <br><br>

        <input
            type="number"
            step="any"
            name="petal_length"
            placeholder="Petal Length"
            required
        >

        <br><br>

        <input
            type="number"
            step="any"
            name="petal_width"
            placeholder="Petal Width"
            required
        >

        <br><br>

        <button type="submit">
            Predict
        </button>

    </form>

</body>

</html>
