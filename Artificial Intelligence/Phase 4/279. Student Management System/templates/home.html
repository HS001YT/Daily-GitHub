<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Student</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <h1>
        Student Management System
    </h1>

    <form
        action="/add"
        method="POST"
    >

        <input
            type="text"
            name="name"
            placeholder="Enter Name"
            required
        >

        <br><br>

        <input
            type="number"
            name="age"
            placeholder="Enter Age"
            required
        >

        <br><br>

        <input
            type="text"
            name="course"
            placeholder="Enter Course"
            required
        >

        <br><br>

        <button type="submit">
            Add Student
        </button>

    </form>

    <br>

    <a href="/students">
        View Students
    </a>

</body>

</html>
