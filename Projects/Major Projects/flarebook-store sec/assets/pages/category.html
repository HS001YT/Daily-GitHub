<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Categories - FlareBook Store</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/icons/favicon.png">
</head>
<body>
    <!-- Main Content -->
    <div id="main-content" class="main-content">
        <!-- Header will be loaded here -->
        <div id="header-container"></div>

        <!-- Main Content Area -->
        <main class="main-content-area categories-page">
            <div class="container">
                <div class="page-header">
                    <h1 class="page-title">Book Categories</h1>
                    <p class="page-subtitle">Browse books by genre and topic</p>
                </div>
                
                <div class="categories-grid">
                    <!-- Your categories content here -->
                </div>
            </div>
        </main>
    </div>

    <script src="../js/navigation.js"></script>
    <script src="../js/main.js"></script>
    <script>
        // Load header dynamically
        document.addEventListener('DOMContentLoaded', function() {
            // Load the full header
            fetch('../../assets/components/full-header.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('header-container').innerHTML = html;
                    
                    // Initialize app if it exists
                    if (window.flareBookApp) {
                        window.flareBookApp.updateUserUI();
                        window.flareBookApp.bindEvents();
                        window.flareBookApp.setupHeaderScroll();
                    }
                })
                .catch(error => {
                    console.error('Error loading header:', error);
                });
        });
    </script>
</body>
</html>
