<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AI Chatbot with Memory
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="app-container">


    <!-- HEADER -->

    <header class="header">

        <div class="header-content">


            <div>

                <div class="badge">
                    DAY 337
                </div>


                <h1>
                    AI Chatbot
                </h1>


                <p>
                    Flask + Gemini + Conversation Memory
                </p>

            </div>


            <div class="header-actions">

                <div
                    class="memory-status"
                >

                    <span
                        class="memory-dot"
                    ></span>


                    <span>

                        Memory:
                        <strong
                            id="memoryCount"
                        >
                            0
                        </strong>

                        messages

                    </span>

                </div>


                <button
                    id="clearMemoryButton"
                    class="clear-memory-button"
                >

                    Clear Memory

                </button>

            </div>


        </div>

    </header>



    <!-- CHAT AREA -->

    <main
        class="chat-container"
        id="chatContainer"
    >


        <div class="message assistant-message">


            <div class="avatar">

                AI

            </div>


            <div class="message-content">


                <div class="message-name">

                    AI Assistant

                </div>


                <div class="message-bubble">

                    Hello! 👋

                    <br><br>

                    I can now remember our conversation
                    during this session.

                    <br><br>

                    Tell me something and then ask me
                    about it later!

                </div>


            </div>


        </div>


    </main>



    <!-- INPUT -->

    <footer class="input-area">


        <div class="input-container">


            <textarea
                id="messageInput"
                placeholder="Ask anything..."
                rows="1"
            ></textarea>


            <button
                id="sendButton"
                aria-label="Send message"
            >


                <span
                    id="sendIcon"
                >

                    ➤

                </span>


                <span
                    id="loadingIcon"
                    class="loading"
                ></span>


            </button>


        </div>


        <p class="input-hint">

            Conversation memory is active ·
            Enter to send ·
            Shift + Enter for new line

        </p>


    </footer>


</div>



<script
    src="{{ url_for('static', filename='script.js') }}"
></script>


</body>

</html>
