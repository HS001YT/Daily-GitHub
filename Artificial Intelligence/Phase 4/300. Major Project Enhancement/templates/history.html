{% extends "base.html" %}

{% block content %}

<h1>
    Expense History
</h1>

<form method="GET">

    <input
        type="text"
        name="search"
        placeholder="Search Expense"
        value="{{ search }}"
    >

    <button type="submit">
        Search
    </button>

</form>

<table>

    <thead>

        <tr>

            <th>ID</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Actions</th>

        </tr>

    </thead>

    <tbody>

        {% for expense in expenses %}

        <tr>

            <td>{{ expense[0] }}</td>

            <td>{{ expense[1] }}</td>

            <td>₹{{ expense[2] }}</td>

            <td>{{ expense[3] }}</td>

            <td>

                <a
                    class="edit-btn"
                    href="/edit/{{ expense[0] }}"
                >
                    Edit
                </a>

                <a
                    class="delete-btn"
                    href="/delete/{{ expense[0] }}"
                    onclick="return confirm('Delete this expense?')"
                >
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
